name: Daily scan

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays 21:30 UTC = 2:30pm PDT / 1:30pm PST, after the close
  workflow_dispatch:           # "Run workflow" button for a test run

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: cache
          key: yahoo-${{ github.run_id }}
          restore-keys: yahoo-

      - name: Install packages
        run: pip install -q -r requirements.txt

      - name: Get the latest lists from the page
        run: python sync_lists.py

      - name: Scan the market
        run: python github_scan.py || (echo "retrying in 3 minutes" && sleep 180 && python github_scan.py)

      - name: Save results to the "results" branch
        run: |
          mkdir -p /tmp/out
          cp site/scan.json site/status.json /tmp/out/
          [ -f site/comeback.json ] && cp site/comeback.json /tmp/out/ || true
          [ -f site/data.json ] && cp site/data.json /tmp/out/ || true
          cd /tmp/out
          git init -q -b results
          git add .
          git -c user.name="royal-b-bot" -c user.email="royal-b-bot@users.noreply.github.com" commit -q -m "Scan $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" results
